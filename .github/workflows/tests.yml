# Manexware fork: the fork's tests on Linux and on macOS (Apple Silicon).
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nginx rsync

      - name: Tools (macOS)
        if: runner.os == 'macOS'
        # nginx for the `nginx -t` test; the system rsync is what users have.
        run: brew install nginx

      - name: Install
        run: python -m pip install -e . pytest

      - name: Tests
        run: python -m pytest -v tests/test_manex_fork.py

      - name: CLI smoke test
        shell: bash
        run: |
          chk --version
          rkd --help >/dev/null
          chk instance --help
          tmp=$(mktemp -d) && cd "$tmp"
          chk init --profile odoo19-ce --db-mode vps --proxy nginx
          cat .rkd/instance_defaults.yaml
          rsync --version | head -1
