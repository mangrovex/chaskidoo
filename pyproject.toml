[project]
name = "chaskidoo"
version = "0.1.0"
description = "Chaskidoo (Manexware fork of rocketdoo): Odoo environments with Docker; PostgreSQL in Docker, on the VPS or external; Nginx or Traefik."
authors = [
    { name = "Horacio Montaño", email = "horaciomontano@hdmsoft.com.ar" }
]
maintainers = [
    { name = "Manuel Vega", email = "manuel.vega@manexware.com" }
]
readme = "README.md"
license = "LGPL-3.0-only"
license-files = ["LICENSE", "COPYING"]
keywords = ["odoo", "docker", "deploy", "devops", "postgresql", "nginx", "traefik", "erp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Installation/Setup",
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.3",
    "copier>=9.2.0",
    "jinja2>=3.1.2",
    "pyyaml>=6.0",
    "rich>=13.0",
    "pyfiglet>=1.0",
    "questionary>=1.10.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2",
]

[project.urls]
Homepage = "https://mangrovex.github.io/chaskidoo/"
Documentation = "https://mangrovex.github.io/chaskidoo/"
Repository = "https://github.com/mangrovex/chaskidoo"
Issues = "https://github.com/mangrovex/chaskidoo/issues"
Upstream = "https://pypi.org/project/rocketdoo/"

[project.scripts]
chaskidoo = "rocketdoo.cli:main"
chk = "rocketdoo.cli:main"
# Compatibility with rocketdoo: same CLI under its old names.
rkd = "rocketdoo.cli:main"
rocketdoo = "rocketdoo.cli:main"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

# 🚀 Automatic package detection
[tool.setuptools.packages.find]
where = ["."]
include = ["rocketdoo*"]

# 🚀 Include templates in the package
[tool.setuptools.package-data]
rocketdoo = [
    "templates/.gitignore.jinja",
    "templates/**/*",
    "templates/**/**/*",
    "templates/**/.vscode/*",
    "templates/**/*.jinja",
    "templates/deploy/*",
    "templates/**/.*",
    "templates/**/**/.*",
    "gui/static/*",
    "gui/static/**/*",
]

[tool.setuptools]
include-package-data = true

# ─────────────────────────── Tests ───────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "docker: requires a working Docker daemon (skipped when unavailable)",
    "slow: takes more than a couple of seconds",
]
filterwarnings = ["error::DeprecationWarning:rocketdoo.*"]

# ─────────────────────────── Lint ────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 127
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I"]
# E501 (line-too-long) is pure style over 322 pre-existing lines; revisit in #137.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
